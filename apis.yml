aid: qodo-gen
url: https://raw.githubusercontent.com/api-evangelist/qodo-gen/refs/heads/main/apis.yml
name: Qodo
kind: company
description: Qodo (formerly CodiumAI) is an AI code quality and integrity platform
  for the whole software development lifecycle. Its products include Qodo Gen (an
  AI coding assistant IDE plugin for code generation, chat, and test generation),
  Qodo Merge (an agentic pull request review app for GitHub, GitLab, Bitbucket, and
  Azure DevOps, built on the open-source PR-Agent project), Qodo Command / Qodo Gen
  CLI (a terminal agent runner installed via npm that can serve agents as HTTP APIs
  or MCP services), Qodo Cover (test coverage automation), and Qodo Aware (codebase
  context). Qodo's public surfaces are primarily an IDE plugin, a Git application
  driven by webhooks and PR comment commands, and a CLI - the hosted platform REST
  surface is gated. The open-source PR-Agent engine (MIT) that powers Qodo Merge is
  self-hostable as a CLI, GitHub Action, or webhook server.
