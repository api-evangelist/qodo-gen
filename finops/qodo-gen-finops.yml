description: >-
  FinOps view of Qodo spend. Qodo (formerly CodiumAI) is billed as a seat-based
  SaaS with pooled usage credits. The dominant cost drivers are the number of
  seats (Pro Team at 30 US dollars per user per month, up to 30 users) and credit
  consumption, where PR reviews and agent runs draw down pooled monthly credit
  packs (2,500 / 5,000 / 20,000 credits at roughly 0.012 US dollars per credit).
  Enterprise is a negotiated annual contract that adds SSO, single-tenant or
  on-prem deployment, and BYOK, which shifts LLM inference cost onto the
  customer's own model provider. When the open-source PR-Agent engine is
  self-hosted, there is no Qodo invoice at all - cost becomes your LLM API usage
  plus infrastructure.
notes: >-
  Per-credit and Enterprise rates are not reconciled here; verify at
  qodo.ai/pricing. Two distinct cost models exist: hosted Qodo (seats + credits,
  optionally BYOK for LLM) and self-hosted PR-Agent (LLM API usage + infra, no
  Qodo fee).
