meters:
- name: seats
  description: Active user seats on the Pro Team plan, billed per user per month.
  unit: seats
  aggregation: max
  dimensions:
  - account
  - team
- name: credits
  description: Pooled credits consumed by PR reviews and agent runs on the hosted platform.
  unit: credits
  aggregation: sum
  dimensions:
  - account
  - team
- name: pr_reviews
  description: Pull request reviews performed by Qodo Merge; each consumes credits.
  unit: reviews
  aggregation: sum
  dimensions:
  - account
  - repository
- name: byok_llm_tokens
  description: LLM tokens billed by the customer's own model provider under BYOK / self-hosted PR-Agent (no Qodo invoice).
  unit: tokens
  aggregation: sum
  dimensions:
  - account
  - model
principles:
- name: Visibility
  description: Track seats, pooled credit burn, and PR reviews per repository and team; under BYOK/self-hosted, monitor LLM token spend at the model provider.
- name: Allocation
  description: Map seats and credit consumption to teams and repositories so review spend ties back to cost centers.
- name: Optimization
  description: Right-size seats, choose the credit pack that matches review volume, set the Pro Team overage cap, and self-host PR-Agent when volume makes owned infrastructure cheaper than credits.
- name: Accountability
  description: Assign an owner per team; review monthly credit burn against the pack allowance and overage cap.
