actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists on any Qodo product. Qodo's public
    surfaces are an IDE plugin, a webhook-driven Git app invoked by PR comment
    commands, and a CLI that can serve agents over local HTTP or MCP. The only
    confirmed documented HTTP endpoint on a Qodo host is the single-tenant Qodo
    Merge webhook receiver; the remaining capability areas are modeled from the
    open-source PR-Agent tools and the CLI documentation and flagged x-modeled in
    the OpenAPI. No AsyncAPI document was created because there is no server-push
    transport on any Qodo API to model.
